# Deploy de produção na Vercel a partir de tags numéricas (ex.: 0.1, 0.1.2).
#
#   git tag 0.1 && git push origin 0.1
#
# Segredos necessários no repositório (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN       token pessoal (vercel.com/account/tokens)
#   VERCEL_ORG_ID      id do time/conta  (.vercel/project.json após `vercel link`)
#   VERCEL_PROJECT_ID  id do projeto     (.vercel/project.json após `vercel link`)

name: deploy

on:
  push:
    tags:
      - "[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: deploy-producao
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Confere se a tag está na master
        run: |
          git fetch origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::A tag $GITHUB_REF_NAME aponta para um commit que não está na master."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint

      - run: npm install --global vercel@65

      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Publicado $GITHUB_REF_NAME em $url" >> "$GITHUB_STEP_SUMMARY"
